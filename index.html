<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Duck Pond Score</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: contain; 
        }
        /* Custom button active state for better touch feedback */
        .btn-tap:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
        .duck-icon {
            width: 46px;
            height: 46px;
            object-fit: contain;
        }
        .duck-icon.flip {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-b from-sky-100 via-sky-200 to-teal-500 text-slate-900">

    <!-- Main Scoring Controls -->
    <main class="flex-grow px-3 pt-4 pb-6 w-full max-w-sm mx-auto space-y-3">
        <div class="text-center mb-1">
            <p class="text-[9px] font-bold uppercase tracking-[0.55em] text-sky-800/70 mb-1">Total Score</p>
            <div class="flex items-center justify-center gap-2 text-4xl font-black text-sky-900">
                <img src="icon.png" alt="" aria-hidden="true" class="duck-icon flip">
                <span id="total-display" class="tabular-nums tracking-tight leading-none">0</span>
                <img src="icon.png" alt="" aria-hidden="true" class="duck-icon">
            </div>
        </div>

        <section class="bg-white/70 rounded-2xl border border-sky-200 shadow-md shadow-sky-500/15 p-3 space-y-3">
            <div class="flex items-center justify-between text-xs font-semibold uppercase tracking-[0.3em] text-sky-800/80">
                <span>Timer</span>
                <span id="timer-hint" class="text-[10px] text-slate-500">Ready to start</span>
            </div>

            <!-- Setup Screen -->
            <div id="timer-setup-screen" class="space-y-2">
                <div class="flex flex-wrap items-center gap-2 text-xs">
                    <label for="timer-start-input" class="uppercase tracking-[0.3em] text-slate-500 text-[10px]">Seconds</label>
                    <input id="timer-start-input" type="number" min="5" max="3600" step="5" value="120" class="flex-1 min-w-[120px] rounded-lg border border-slate-200 bg-white/80 px-2 py-1.5 text-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-400" />
                </div>
                <button onclick="startFromSetup()" class="btn-tap w-full py-2 rounded-xl bg-sky-500/90 text-white text-sm font-semibold">Start</button>
            </div>

            <!-- Running Screen -->
            <div id="timer-running-screen" class="space-y-4 hidden">
                <div id="timer-display" class="text-3xl font-black text-sky-900 text-center tabular-nums">00:00.000</div>
                <div class="grid grid-cols-3 gap-2 text-xs font-semibold">
                    <button onclick="startTimer()" class="btn-tap py-2 rounded-xl bg-sky-500/90 text-white">Start</button>
                    <button onclick="pauseTimer()" class="btn-tap py-2 rounded-xl bg-amber-400/90 text-slate-900">Pause</button>
                    <button onclick="stopTimer()" class="btn-tap py-2 rounded-xl bg-rose-400/90 text-white">Stop</button>
                </div>
            </div>
        </section>
        
        <!-- 500 Point Zone -->
        <div class="bg-white/80 rounded-2xl border border-amber-200 shadow h-20 overflow-hidden">
            <div class="flex items-stretch h-full">
                <button onclick="updateScore(-500)" class="btn-tap w-14 flex items-center justify-center text-amber-700 border-r border-amber-200 bg-amber-100/70" aria-label="Subtract 500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
                </button>
                <div class="flex-grow flex flex-col items-center justify-center gap-0.5 bg-gradient-to-b from-amber-50/80 to-white py-1.5">
                    <span class="text-xl font-black leading-none text-amber-700">500</span>
                    <span class="text-[9px] font-semibold uppercase tracking-[0.35em] text-amber-700/70">Points</span>
                    <div>
                        <span id="count-500" class="text-xl font-mono tracking-tight text-amber-800">x0</span>
                    </div>
                </div>
                <button onclick="updateScore(500)" class="btn-tap w-16 flex items-center justify-center text-amber-950 bg-amber-400 font-semibold" aria-label="Add 500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
            </div>
        </div>

        <!-- 300 Point Zone -->
        <div class="bg-white/80 rounded-2xl border border-teal-200 shadow h-20 overflow-hidden">
            <div class="flex items-stretch h-full">
                <button onclick="updateScore(-300)" class="btn-tap w-14 flex items-center justify-center text-teal-700 border-r border-teal-200 bg-teal-100/70" aria-label="Subtract 300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
                </button>
                <div class="flex-grow flex flex-col items-center justify-center gap-0.5 bg-gradient-to-b from-teal-50/80 to-white py-1.5">
                    <span class="text-xl font-black leading-none text-teal-700">300</span>
                    <span class="text-[9px] font-semibold uppercase tracking-[0.35em] text-teal-700/70">Points</span>
                    <div>
                        <span id="count-300" class="text-xl font-mono tracking-tight text-teal-800">x0</span>
                    </div>
                </div>
                <button onclick="updateScore(300)" class="btn-tap w-16 flex items-center justify-center text-teal-950 bg-teal-300 font-semibold" aria-label="Add 300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
            </div>
        </div>

        <!-- 100 Point Zone -->
        <div class="bg-white/80 rounded-2xl border border-sky-200 shadow h-20 overflow-hidden">
            <div class="flex items-stretch h-full">
                <button onclick="updateScore(-100)" class="btn-tap w-14 flex items-center justify-center text-sky-700 border-r border-sky-200 bg-sky-100/70" aria-label="Subtract 100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
                </button>
                <div class="flex-grow flex flex-col items-center justify-center gap-0.5 bg-gradient-to-b from-sky-50/80 to-white py-1.5">
                    <span class="text-xl font-black leading-none text-sky-700">100</span>
                    <span class="text-[9px] font-semibold uppercase tracking-[0.35em] text-sky-700/70">Points</span>
                    <div>
                        <span id="count-100" class="text-xl font-mono tracking-tight text-sky-800">x0</span>
                    </div>
                </div>
                <button onclick="updateScore(100)" class="btn-tap w-16 flex items-center justify-center text-sky-950 bg-sky-300 font-semibold" aria-label="Add 100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
            </div>
        </div>

        <!-- 50 Point Zone -->
        <div class="bg-white/80 rounded-2xl border border-emerald-200 shadow h-20 overflow-hidden">
            <div class="flex items-stretch h-full">
                <button onclick="updateScore(-50)" class="btn-tap w-14 flex items-center justify-center text-emerald-700 border-r border-emerald-200 bg-emerald-100/70" aria-label="Subtract 50">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
                </button>
                <div class="flex-grow flex flex-col items-center justify-center gap-0.5 bg-gradient-to-b from-emerald-50/80 to-white py-1.5">
                    <span class="text-xl font-black leading-none text-emerald-700">50</span>
                    <span class="text-[9px] font-semibold uppercase tracking-[0.35em] text-emerald-700/70">Points</span>
                    <div>
                        <span id="count-50" class="text-xl font-mono tracking-tight text-emerald-800">x0</span>
                    </div>
                </div>
                <button onclick="updateScore(50)" class="btn-tap w-16 flex items-center justify-center text-emerald-950 bg-emerald-300 font-semibold" aria-label="Add 50">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
            </div>
        </div>

        <!-- Stats Panel -->
        <section class="bg-white/80 rounded-2xl border border-white/80 shadow-lg shadow-sky-500/10 p-3 space-y-3">
            <div class="flex items-center justify-between text-xs font-semibold uppercase tracking-[0.3em] text-slate-700">
                <span>Stats</span>
                <span class="text-[9px] text-slate-500">Live session</span>
            </div>
            <div class="grid grid-cols-2 gap-3 text-center">
                <div>
                    <p class="text-[10px] uppercase tracking-[0.3em] text-slate-600">Total Ducks</p>
                    <p id="stats-total" class="text-2xl font-black text-slate-900">0</p>
                </div>
                <div>
                    <p class="text-[10px] uppercase tracking-[0.3em] text-slate-600">Ducks / min</p>
                    <p id="stats-ducks-per-minute" class="text-2xl font-black text-slate-900">0</p>
                </div>
                <div>
                    <p class="text-[10px] uppercase tracking-[0.3em] text-slate-600">Sec / duck</p>
                    <p id="stats-seconds-per-duck" class="text-2xl font-black text-slate-900">—</p>
                </div>
                <div>
                    <p class="text-[10px] uppercase tracking-[0.3em] text-slate-600">Bonus Cups</p>
                    <p id="stats-bonus" class="text-2xl font-black text-emerald-800">0</p>
                </div>
            </div>
            <div class="space-y-3">
                <div>
                    <p class="text-[10px] uppercase tracking-[0.3em] text-slate-600">Hit mix</p>
                    <div class="space-y-1.5 text-[11px]">
                        <div>
                            <div class="flex justify-between text-slate-700 font-semibold"><span>500</span><span id="stats-percent-500">0%</span></div>
                            <div class="h-1.5 rounded-full bg-white shadow-inner shadow-slate-200 border border-white/70">
                                <div id="stats-bar-500" class="h-full rounded-full bg-amber-400 transition-all" style="width:0%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-slate-700 font-semibold"><span>300</span><span id="stats-percent-300">0%</span></div>
                            <div class="h-1.5 rounded-full bg-white shadow-inner shadow-slate-200 border border-white/70">
                                <div id="stats-bar-300" class="h-full rounded-full bg-teal-400 transition-all" style="width:0%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-slate-700 font-semibold"><span>100</span><span id="stats-percent-100">0%</span></div>
                            <div class="h-1.5 rounded-full bg-white shadow-inner shadow-slate-200 border border-white/70">
                                <div id="stats-bar-100" class="h-full rounded-full bg-sky-400 transition-all" style="width:0%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-slate-700 font-semibold"><span>50</span><span id="stats-percent-50">0%</span></div>
                            <div class="h-1.5 rounded-full bg-white shadow-inner shadow-slate-200 border border-white/70">
                                <div id="stats-bar-50" class="h-full rounded-full bg-emerald-400 transition-all" style="width:0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <p class="text-[10px] uppercase tracking-[0.3em] text-slate-600">Points share</p>
                    <div class="space-y-1.5 text-[11px]">
                        <div>
                            <div class="flex justify-between text-slate-700 font-semibold"><span>500</span><span id="stats-points-percent-500">0%</span></div>
                            <div class="h-1.5 rounded-full bg-white shadow-inner shadow-slate-200 border border-white/70">
                                <div id="stats-points-bar-500" class="h-full rounded-full bg-amber-600 transition-all" style="width:0%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-slate-700 font-semibold"><span>300</span><span id="stats-points-percent-300">0%</span></div>
                            <div class="h-1.5 rounded-full bg-white shadow-inner shadow-slate-200 border border-white/70">
                                <div id="stats-points-bar-300" class="h-full rounded-full bg-teal-600 transition-all" style="width:0%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-slate-700 font-semibold"><span>100</span><span id="stats-points-percent-100">0%</span></div>
                            <div class="h-1.5 rounded-full bg-white shadow-inner shadow-slate-200 border border-white/70">
                                <div id="stats-points-bar-100" class="h-full rounded-full bg-sky-600 transition-all" style="width:0%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-slate-700 font-semibold"><span>50</span><span id="stats-points-percent-50">0%</span></div>
                            <div class="h-1.5 rounded-full bg-white shadow-inner shadow-slate-200 border border-white/70">
                                <div id="stats-points-bar-50" class="h-full rounded-full bg-emerald-600 transition-all" style="width:0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer Actions -->
    <footer class="px-3 pb-6 w-full max-w-sm mx-auto">
        <button onclick="resetScore()" class="btn-tap w-full py-3 rounded-2xl border border-sky-300 text-sky-900 font-bold uppercase tracking-[0.35em] bg-white/70 backdrop-blur flex items-center justify-center gap-2 shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reset Score
        </button>
    </footer>

    <script>
        const SCORING_ZONES = [500, 300, 100];
        const BONUS_ZONE = 50;

        let currentScore = 0;
        let counts = {
            500: 0,
            300: 0,
            100: 0,
            50: 0
        };

        const displayElement = document.getElementById('total-display');
        const timerDisplay = document.getElementById('timer-display');
        const timerStartInput = document.getElementById('timer-start-input');
        const timerSetupScreen = document.getElementById('timer-setup-screen');
        const timerRunningScreen = document.getElementById('timer-running-screen');
        const timerHint = document.getElementById('timer-hint');

        const statsTotal = document.getElementById('stats-total');
        const statsDucksPerMinute = document.getElementById('stats-ducks-per-minute');
        const statsSecondsPerDuck = document.getElementById('stats-seconds-per-duck');
        const statsBonus = document.getElementById('stats-bonus');
        const statsPercent = {
            500: document.getElementById('stats-percent-500'),
            300: document.getElementById('stats-percent-300'),
            100: document.getElementById('stats-percent-100'),
            50: document.getElementById('stats-percent-50')
        };
        const statsBars = {
            500: document.getElementById('stats-bar-500'),
            300: document.getElementById('stats-bar-300'),
            100: document.getElementById('stats-bar-100'),
            50: document.getElementById('stats-bar-50')
        };
        const statsPointsPercent = {
            500: document.getElementById('stats-points-percent-500'),
            300: document.getElementById('stats-points-percent-300'),
            100: document.getElementById('stats-points-percent-100'),
            50: document.getElementById('stats-points-percent-50')
        };
        const statsPointsBars = {
            500: document.getElementById('stats-points-bar-500'),
            300: document.getElementById('stats-points-bar-300'),
            100: document.getElementById('stats-points-bar-100'),
            50: document.getElementById('stats-points-bar-50')
        };

        let timerStartSeconds = normalizeTimerValue(timerStartInput ? parseInt(timerStartInput.value, 10) : 120);
        let timerRemainingMs = timerStartSeconds * 1000;
        let timerInterval = null;
        let timerTargetEndTs = null;
        let sessionStartTimestamp = null;

        if (timerStartInput) {
            timerStartInput.value = timerStartSeconds;
    }
    updateStats();
        updateTimerDisplay();

        // Initialize from localStorage if available
        if(localStorage.getItem('simpleScoreKeeperData')) {
            const data = JSON.parse(localStorage.getItem('simpleScoreKeeperData'));
            currentScore = data.score || 0;
            counts = data.counts || { 500: 0, 300: 0, 100: 0, 50: 0 };
            updateDisplay();
        }

        function updateScore(amount) {
            currentScore += amount;
            
            // Update individual counts
            const zone = Math.abs(amount);
            if (amount > 0) {
                counts[zone]++;
            } else {
                // Decrement but allow negative if correcting a mistake? 
                // Or floor at 0? Standard scorekeeping usually allows full correction.
                counts[zone]--; 
            }

            saveAndUpdate();
        }

        function resetScore() {
            if(confirm("Are you sure you want to reset the score to 0?")) {
                currentScore = 0;
                counts = { 500: 0, 300: 0, 100: 0, 50: 0 };
                saveAndUpdate();
            }
        }

        function saveAndUpdate() {
            updateDisplay();
            localStorage.setItem('simpleScoreKeeperData', JSON.stringify({
                score: currentScore,
                counts: counts
            }));
        }
        
        function updateDisplay() {
            // Update Main Score
            displayElement.innerText = currentScore.toLocaleString();
            
            // Update Counts
            document.getElementById('count-500').innerText = `x${counts[500]}`;
            document.getElementById('count-300').innerText = `x${counts[300]}`;
            document.getElementById('count-100').innerText = `x${counts[100]}`;
            document.getElementById('count-50').innerText = `x${counts[50]}`;
            updateStats();
        }

        function updateStats() {
            if (!statsTotal) return;
            const positiveCounts = {
                500: Math.max(0, counts[500]),
                300: Math.max(0, counts[300]),
                100: Math.max(0, counts[100]),
                50: Math.max(0, counts[50])
            };
            const scorableHits = SCORING_ZONES.reduce((sum, zone) => sum + positiveCounts[zone], 0);
            const totalHitsForMix = scorableHits + positiveCounts[BONUS_ZONE];
            const totalPointsScored = SCORING_ZONES.reduce((sum, zone) => sum + positiveCounts[zone] * zone, 0) + positiveCounts[BONUS_ZONE] * BONUS_ZONE;

            if (statsBonus) {
                statsBonus.innerText = positiveCounts[BONUS_ZONE].toLocaleString();
            }
            if (scorableHits > 0 && !sessionStartTimestamp) {
                sessionStartTimestamp = Date.now();
            }

            if (scorableHits === 0) {
                statsTotal.innerText = '0';
                statsDucksPerMinute.innerText = '0';
                statsSecondsPerDuck.innerText = '—';
                sessionStartTimestamp = null;
            } else {
                const now = Date.now();
                const elapsedMs = Math.max(1, sessionStartTimestamp ? now - sessionStartTimestamp : 1);
                const elapsedMinutes = elapsedMs / 60000;
                const ducksPerMinute = scorableHits / elapsedMinutes;
                const elapsedSeconds = elapsedMs / 1000;
                const secondsPerDuck = elapsedSeconds / scorableHits;
                statsTotal.innerText = scorableHits.toLocaleString();
                statsDucksPerMinute.innerText = ducksPerMinute.toFixed(1);
                statsSecondsPerDuck.innerText = secondsPerDuck.toFixed(1);
            }

            Object.keys(positiveCounts).forEach(zone => {
                const count = positiveCounts[zone];
                const percent = totalHitsForMix === 0 ? 0 : (count / totalHitsForMix) * 100;
                if (statsPercent[zone]) {
                    statsPercent[zone].innerText = `${percent.toFixed(0)}%`;
                }
                if (statsBars[zone]) {
                    statsBars[zone].style.width = `${percent}%`;
                }
                const pointsPercent = totalPointsScored === 0 ? 0 : ((count * zone) / totalPointsScored) * 100;
                if (statsPointsPercent[zone]) {
                    statsPointsPercent[zone].innerText = `${pointsPercent.toFixed(0)}%`;
                }
                if (statsPointsBars[zone]) {
                    statsPointsBars[zone].style.width = `${pointsPercent}%`;
                }
            });
        }

        function normalizeTimerValue(value) {
            if (isNaN(value)) return 120;
            return Math.min(3600, Math.max(5, value));
        }

        function updateTimerDisplay() {
            if (!timerDisplay) return;
            const totalMs = Math.max(0, timerRemainingMs);
            const totalSeconds = totalMs / 1000;
            const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const seconds = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
            const milliseconds = Math.floor(totalMs % 1000).toString().padStart(3, '0');
            timerDisplay.innerText = `${minutes}:${seconds}.${milliseconds}`;
        }

        function setTimerState(state) {
            if (!timerSetupScreen || !timerRunningScreen || !timerHint) return;
            if (state === 'running') {
                timerSetupScreen.classList.add('hidden');
                timerRunningScreen.classList.remove('hidden');
                timerHint.innerText = 'Timer running';
            } else {
                timerSetupScreen.classList.remove('hidden');
                timerRunningScreen.classList.add('hidden');
                timerHint.innerText = 'Ready to start';
            }
        }
        setTimerState('setup');

        function startFromSetup() {
            const newValue = normalizeTimerValue(timerStartInput ? parseInt(timerStartInput.value, 10) : 120);
            timerStartSeconds = newValue;
            timerRemainingMs = newValue * 1000;
            if (timerStartInput) {
                timerStartInput.value = newValue;
            }
            updateTimerDisplay();
            startTimer();
        }

        function startTimer() {
            if (timerInterval || timerRemainingMs <= 0) return;
            const now = performance.now();
            timerTargetEndTs = now + timerRemainingMs;
            setTimerState('running');
            timerHint.innerText = 'Timer running';
            timerInterval = requestAnimationFrame(tickTimer);
        }

        function tickTimer() {
            if (!timerTargetEndTs) return;
            const now = performance.now();
            timerRemainingMs = Math.max(0, timerTargetEndTs - now);
            updateTimerDisplay();
            if (timerRemainingMs <= 0) {
                stopTimer();
            } else if (timerInterval) {
                timerInterval = requestAnimationFrame(tickTimer);
            }
        }

        function pauseTimer() {
            if (!timerInterval) return;
            cancelAnimationFrame(timerInterval);
            timerInterval = null;
            timerTargetEndTs = null;
            timerHint.innerText = 'Paused — press Start to resume';
        }

        function stopTimer() {
            if (timerInterval) {
                cancelAnimationFrame(timerInterval);
                timerInterval = null;
            }
            timerTargetEndTs = null;
            timerRemainingMs = timerStartSeconds * 1000;
            updateTimerDisplay();
            setTimerState('setup');
        }
    </script>
</body>
</html>
