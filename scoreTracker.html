<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Score Keeper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: contain; 
        }
        /* Custom button active state for better touch feedback */
        .btn-tap:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
        .duck-icon {
            width: 76px;
            height: 76px;
            object-fit: contain;
        }
        .duck-icon.flip {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-b from-sky-100 via-sky-200 to-teal-500 text-slate-900">

    <!-- Main Scoring Controls -->
    <main class="flex-grow px-4 pt-8 pb-8 w-full max-w-md mx-auto space-y-5">
        <div class="text-center mb-2">
            <p class="text-xs font-bold uppercase tracking-[0.4em] text-sky-800/70 mb-2">Total Score</p>
            <div class="flex items-center justify-center gap-3 text-6xl font-black text-sky-900">
                <img src="icon.png" alt="" aria-hidden="true" class="duck-icon flip">
                <span id="total-display" class="tabular-nums tracking-tight leading-none">0</span>
                <img src="icon.png" alt="" aria-hidden="true" class="duck-icon">
            </div>
        </div>
        
        <!-- 500 Point Zone -->
        <div class="bg-white/80 rounded-2xl border border-amber-200 shadow-lg shadow-amber-500/15 overflow-hidden">
            <div class="flex items-stretch h-28">
                <button onclick="updateScore(-500)" class="btn-tap w-20 flex items-center justify-center text-amber-700 border-r border-amber-200 bg-amber-100/70" aria-label="Subtract 500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
                </button>
                <div class="flex-grow flex flex-col items-center justify-center gap-1 bg-gradient-to-b from-amber-50/80 to-white py-2">
                    <span class="text-3xl font-black leading-none text-amber-700">500</span>
                    <span class="text-[11px] font-semibold uppercase tracking-[0.4em] text-amber-700/70">Points</span>
                    <div>
                        <span id="count-500" class="text-3xl font-mono tracking-tight text-amber-800">x0</span>
                    </div>
                </div>
                <button onclick="updateScore(500)" class="btn-tap w-24 flex items-center justify-center text-amber-950 bg-amber-400 font-semibold" aria-label="Add 500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
            </div>
        </div>

        <!-- 300 Point Zone -->
        <div class="bg-white/80 rounded-2xl border border-teal-200 shadow-lg shadow-teal-500/15 overflow-hidden">
            <div class="flex items-stretch h-28">
                <button onclick="updateScore(-300)" class="btn-tap w-20 flex items-center justify-center text-teal-700 border-r border-teal-200 bg-teal-100/70" aria-label="Subtract 300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
                </button>
                <div class="flex-grow flex flex-col items-center justify-center gap-1 bg-gradient-to-b from-teal-50/80 to-white py-2">
                    <span class="text-3xl font-black leading-none text-teal-700">300</span>
                    <span class="text-[11px] font-semibold uppercase tracking-[0.4em] text-teal-700/70">Points</span>
                    <div>
                        <span id="count-300" class="text-3xl font-mono tracking-tight text-teal-800">x0</span>
                    </div>
                </div>
                <button onclick="updateScore(300)" class="btn-tap w-24 flex items-center justify-center text-teal-950 bg-teal-300 font-semibold" aria-label="Add 300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
            </div>
        </div>

        <!-- 100 Point Zone -->
        <div class="bg-white/80 rounded-2xl border border-sky-200 shadow-lg shadow-sky-500/15 overflow-hidden">
            <div class="flex items-stretch h-28">
                <button onclick="updateScore(-100)" class="btn-tap w-20 flex items-center justify-center text-sky-700 border-r border-sky-200 bg-sky-100/70" aria-label="Subtract 100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
                </button>
                <div class="flex-grow flex flex-col items-center justify-center gap-1 bg-gradient-to-b from-sky-50/80 to-white py-2">
                    <span class="text-3xl font-black leading-none text-sky-700">100</span>
                    <span class="text-[11px] font-semibold uppercase tracking-[0.4em] text-sky-700/70">Points</span>
                    <div>
                        <span id="count-100" class="text-3xl font-mono tracking-tight text-sky-800">x0</span>
                    </div>
                </div>
                <button onclick="updateScore(100)" class="btn-tap w-24 flex items-center justify-center text-sky-950 bg-sky-300 font-semibold" aria-label="Add 100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
            </div>
        </div>

        <!-- 50 Point Zone -->
        <div class="bg-white/80 rounded-2xl border border-emerald-200 shadow-lg shadow-emerald-500/15 overflow-hidden">
            <div class="flex items-stretch h-28">
                <button onclick="updateScore(-50)" class="btn-tap w-20 flex items-center justify-center text-emerald-700 border-r border-emerald-200 bg-emerald-100/70" aria-label="Subtract 50">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
                </button>
                <div class="flex-grow flex flex-col items-center justify-center gap-1 bg-gradient-to-b from-emerald-50/80 to-white py-2">
                    <span class="text-3xl font-black leading-none text-emerald-700">50</span>
                    <span class="text-[11px] font-semibold uppercase tracking-[0.4em] text-emerald-700/70">Points</span>
                    <div>
                        <span id="count-50" class="text-3xl font-mono tracking-tight text-emerald-800">x0</span>
                    </div>
                </div>
                <button onclick="updateScore(50)" class="btn-tap w-24 flex items-center justify-center text-emerald-950 bg-emerald-300 font-semibold" aria-label="Add 50">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
            </div>
        </div>

    </main>

    <!-- Footer Actions -->
    <footer class="px-4 pb-8 w-full max-w-md mx-auto">
        <button onclick="resetScore()" class="btn-tap w-full py-4 rounded-2xl border border-sky-300 text-sky-900 font-bold uppercase tracking-[0.4em] bg-white/70 backdrop-blur flex items-center justify-center gap-2 shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reset Score
        </button>
    </footer>

    <script>
        let currentScore = 0;
        let counts = {
            500: 0,
            300: 0,
            100: 0,
            50: 0
        };

        const displayElement = document.getElementById('total-display');

        // Initialize from localStorage if available
        if(localStorage.getItem('simpleScoreKeeperData')) {
            const data = JSON.parse(localStorage.getItem('simpleScoreKeeperData'));
            currentScore = data.score || 0;
            counts = data.counts || { 500: 0, 300: 0, 100: 0, 50: 0 };
            updateDisplay();
        }

        function updateScore(amount) {
            currentScore += amount;
            
            // Update individual counts
            const zone = Math.abs(amount);
            if (amount > 0) {
                counts[zone]++;
            } else {
                // Decrement but allow negative if correcting a mistake? 
                // Or floor at 0? Standard scorekeeping usually allows full correction.
                counts[zone]--; 
            }

            saveAndUpdate();
        }

        function resetScore() {
            if(confirm("Are you sure you want to reset the score to 0?")) {
                currentScore = 0;
                counts = { 500: 0, 300: 0, 100: 0, 50: 0 };
                saveAndUpdate();
            }
        }

        function saveAndUpdate() {
            updateDisplay();
            localStorage.setItem('simpleScoreKeeperData', JSON.stringify({
                score: currentScore,
                counts: counts
            }));
        }
        
        function updateDisplay() {
            // Update Main Score
            displayElement.innerText = currentScore.toLocaleString();
            
            // Update Counts
            document.getElementById('count-500').innerText = `x${counts[500]}`;
            document.getElementById('count-300').innerText = `x${counts[300]}`;
            document.getElementById('count-100').innerText = `x${counts[100]}`;
            document.getElementById('count-50').innerText = `x${counts[50]}`;
        }
    </script>
</body>
</html>
